<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABESEC Portal Login | Student Support AI</title>
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="brand-header">
                <div class="college-logo-icon">🏛️</div>
                <h1>ABES Engineering College</h1>
                <p class="affiliation">Approved by AICTE | Affiliated to AKTU, Lucknow</p>
                <div class="portal-badge">Student Support AI Portal</div>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="studentId">
                        Student ID / Username
                    </label>
                    <input
                        type="text"
                        id="studentId"
                        placeholder="e.g. AK0001 or admin"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        Password
                    </label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" id="submitBtn">
                    <span>Sign In to Portal</span>
                </button>

            </form>

            <div id="message" class="message-box" style="display: none;"></div>

            <!-- Demo Credentials Helper for Evaluators / Demonstrations -->
            <div class="demo-card">
                <p class="demo-title">⚡ Quick Demo Credentials:</p>
                <div class="demo-chips">
                    <button type="button" class="demo-btn" onclick="fillCredentials('AK0001', '123456')">
                        👨‍🎓 Student: <strong>AK0001</strong>
                    </button>
                    <button type="button" class="demo-btn" onclick="fillCredentials('admin', 'Admin@123')">
                        ⚙️ Admin: <strong>admin</strong>
                    </button>
                </div>
            </div>

            <div class="portal-footer">
                <p>Campus Address: 19th KM Stone, NH-09, Ghaziabad, UP (201009)</p>
                <p>Direct Support: <a href="mailto:info@abes.ac.in">info@abes.ac.in</a> | Phone: 0120-7135112</p>
            </div>

        </div>

    </div>

    <script src="login.js"></script>

</body>
</html>
